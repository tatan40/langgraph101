[project]
name = "temperament-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.4",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "typesafe-sdk>=0.7.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "PL"]
# Long prompt strings can't be wrapped by the formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
"eval/*" = ["PLR2004"]
